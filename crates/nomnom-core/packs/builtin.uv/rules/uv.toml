# uv's cache, `%LocalAppData%\uv\cache` (`~/.cache/uv` elsewhere). uv writes
# `CACHEDIR.TAG` at its root beside versioned buckets such as `archive-v0`.
# uv's managed Pythons and installed tools live outside the cache and are not
# touched.
[[rule]]
title = "uv cache"
description = "uv's package cache; uv re-downloads and re-unpacks on the next sync"
kind = "cache/v1"
filter = '''
$c has archive-v0
$c has CACHEDIR.TAG
then $c/
'''
