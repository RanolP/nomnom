# CPython's bytecode cache: `__pycache__` holding `.pyc` files (PEP 3147).
[[rule]]
title = "__pycache__/"
description = "regenerable: Python bytecode cache, rewritten on the next import — it holds `{$pyc}`"
kind = "build-output/v1"
filter = '''
$d.dir.name == "__pycache__"
$d has *.pyc as $pyc
then $d/
'''
