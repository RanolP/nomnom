# Next.js's `.next`. `next build`, and `next dev` before Next.js 16, write
# `build-manifest.json` at its root; `next build` also writes `BUILD_ID`.
[[rule]]
title = "Next.js .next/"
description = "regenerable: Next.js build output, rebuilt by `next build` — it holds Next.js's `{$marker}`"
kind = "build-output/v1"
filter = '''
$n.dir.name == ".next"
$n has BUILD_ID | build-manifest.json as $marker
then $n/
'''
