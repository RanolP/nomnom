# npm's installed dependency tree and its caches.

# npm 7 and later write a hidden lockfile, `node_modules/.package-lock.json`,
# into every tree they install. A tree pnpm or Yarn installed over keeps a
# stale npm lockfile beside their own marker, and the later install is the
# one that owns the layout, so their markers take the tree.
[[rule]]
title = "npm node_modules/"
description = "regenerable: npm dependency tree, rebuilt by `npm install` — it holds npm's hidden lockfile `.package-lock.json`"
kind = "build-output/v1"
filter = '''
$n.dir.name == "node_modules"
$n has .package-lock.json
$n lacks .modules.yaml | .pnpm | .pnpm-workspace-state-v1.json | .yarn-integrity | .yarn-state.yml
then $n/
'''

# npm's cacache store under `npm-cache` (`~/.npm` elsewhere): tarballs in
# `content-v2`, their index in `index-v5`.
[[rule]]
title = "npm download cache"
description = "npm's download cache (`_cacache`); npm re-downloads packages on demand"
kind = "cache/v1"
filter = '''
$c.dir.name == "_cacache"
$c has content-v2
$c has index-v5
then $c/
'''

# `_npx` sits beside `_cacache` in npm's cache directory.
[[rule]]
title = "npx package cache"
description = "packages `npx` installed to run once; npx installs them again on the next run"
kind = "cache/v1"
filter = '''
$d has _cacache
then $d/_npx/
'''
