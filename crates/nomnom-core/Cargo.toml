[package]
name = "nomnom-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "File-tree analysis and cleanup core: scan, catalog, verdict, action."

[dependencies]
nomnom-lang.workspace = true
nomnom-pack.workspace = true
ignore.workspace = true
globset.workspace = true
toml.workspace = true
rayon.workspace = true
blake3.workspace = true
trash.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
ntfs.workspace = true
# The elevated scan helper: a UAC launch, a named pipe with an explicit DACL,
# and a token check. Additive to the workspace's feature list.
windows-sys = { workspace = true, features = [
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
