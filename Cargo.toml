[workspace]
resolver = "3"
members = ["crates/nomnom-core", "crates/nomnom-lang", "crates/nomnom-pack", "crates/nomnom-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RanolP/nomnom"

[workspace.dependencies]
nomnom-core = { path = "crates/nomnom-core" }
nomnom-lang = { path = "crates/nomnom-lang" }
nomnom-pack = { path = "crates/nomnom-pack" }

ignore = "0.4.33"
globset = "0.4.20"
rayon = "1.12.0"
blake3 = "1.8.7"
trash = "5.2.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.7", features = ["derive"] }
humansize = "2.1.3"
anyhow = "1.0.104"
thiserror = "2.0.20"
toml = "1.1.6"
tempfile = "3.27.0"

# Windows MFT backend (the WizTree mechanism): read the NTFS Master File Table
# off the raw volume instead of walking the tree.
ntfs = "0.4.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }
